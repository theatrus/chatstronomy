name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Cargo package version to build
        required: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CHATSTRONOMY_GIT_SHA: ${{ github.sha }}

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: linux-${{ matrix.arch }}-cargo-
      - run: cargo test --all-features --locked
      - run: cargo build --release --all-features --locked
      - name: Package executable and redistribution notices
        run: |
          tar -czf "chatstronomy-linux-${{ matrix.arch }}.tar.gz" \
            -C "$GITHUB_WORKSPACE/target/release" chatstronomy \
            -C "$GITHUB_WORKSPACE" LICENSE \
            -C "$GITHUB_WORKSPACE/assets" LiberationSans-LICENSE
      - name: Upload release asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: chatstronomy-linux-${{ matrix.arch }}.tar.gz
      - name: Upload dispatch artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: chatstronomy-linux-${{ matrix.arch }}
          path: chatstronomy-linux-${{ matrix.arch }}.tar.gz

  windows:
    name: Signed Windows and plugin runtimes
    runs-on: windows-latest
    environment: release
    env:
      SIGN_WINDOWS: >-
        ${{ vars.AZURE_CLIENT_ID != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: windows-cargo-
      - name: Resolve version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersion = [string]($metadata.packages | Where-Object name -eq 'chatstronomy' | Select-Object -First 1).version
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME.TrimStart('v') } elseif ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $packageVersion }
          if ($version -ne $packageVersion) { throw "Release $version does not match Cargo.toml $packageVersion" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require signing for canonical releases
        if: github.repository == 'theatrus/chatstronomy' && env.SIGN_WINDOWS != 'true'
        shell: pwsh
        run: throw 'Official Windows releases require Azure trusted signing.'
      - name: Build full Hub runtime
        run: cargo build --release --all-features --locked
      - name: Authenticate for full runtime signing
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign full runtime
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\release\chatstronomy.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - shell: pwsh
        run: Copy-Item target/release/chatstronomy.exe chatstronomy-windows-x64.exe
      - name: Build lean plugin runtime
        run: cargo build --release --no-default-features --locked
      - name: Authenticate for plugin runtime signing
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign plugin runtime
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\release\chatstronomy.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - shell: pwsh
        run: |
          Copy-Item target/release/chatstronomy.exe chatstronomy-plugin-runtime-windows-x64.exe
          $notices = @('LICENSE', 'assets/LiberationSans-LICENSE')
          Compress-Archive -Path (@('contracts') + $notices) -DestinationPath chatstronomy-plugin-contracts-v1.zip
          Compress-Archive -Path (@('chatstronomy-windows-x64.exe') + $notices) -DestinationPath chatstronomy-windows-x64.zip
          Compress-Archive -Path (@('chatstronomy-plugin-runtime-windows-x64.exe') + $notices) -DestinationPath chatstronomy-plugin-runtime-windows-x64.zip
          ./tools/New-ChatstronomyRuntimeManifest.ps1 `
            -PluginRuntimePath ./chatstronomy-plugin-runtime-windows-x64.exe `
            -FullRuntimePath ./chatstronomy-windows-x64.exe `
            -PluginContractsPath ./chatstronomy-plugin-contracts-v1.zip `
            -Tag "v$env:VERSION" `
            -Commit '${{ github.sha }}'
      - name: Verify signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          foreach ($path in @('chatstronomy-windows-x64.exe','chatstronomy-plugin-runtime-windows-x64.exe')) {
            if ((Get-AuthenticodeSignature -LiteralPath $path).Status -ne 'Valid') { throw "$path is not signed" }
          }
      - name: Upload release assets
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            chatstronomy-windows-x64.exe
            chatstronomy-windows-x64.zip
            chatstronomy-plugin-runtime-windows-x64.exe
            chatstronomy-plugin-runtime-windows-x64.zip
            chatstronomy-plugin-contracts-v1.zip
            chatstronomy-runtime-manifest.json
      - name: Upload dispatch artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: signed-windows-${{ env.VERSION }}
          path: |
            chatstronomy-windows-x64.exe
            chatstronomy-windows-x64.zip
            chatstronomy-plugin-runtime-windows-x64.exe
            chatstronomy-plugin-runtime-windows-x64.zip
            chatstronomy-plugin-contracts-v1.zip
            chatstronomy-runtime-manifest.json
