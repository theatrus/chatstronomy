name: CI

# Linux and Windows jobs run on ephemeral 32-core runners (tfinfra
# roots/github-runners, docs/github-runners-plan.md). Other platforms, releases,
# and every pull request from a fork stay on GitHub's runners: a fork's code
# never runs on ours. Job names are unchanged.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
          - name: Linux ARM64
            os: ubuntu-24.04-arm
    runs-on: ${{ (github.event.pull_request.head.repo.fork || (matrix.os != 'ubuntu-latest' && matrix.os != 'windows-latest')) && matrix.os || fromJSON(matrix.os == 'windows-latest' && '["self-hosted","windows","ghr-windows-x64"]' || '["self-hosted","linux","ghr-linux-x64"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux TLS build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev ca-certificates
      - name: Cache Rust build
        # Our runners skip GitHub's cache: Linux ones compile through sccache in
        # S3, and saving the cache to GitHub from AWS is slow.
        if: ${{ !startsWith(runner.name, 'ghr-') }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
            ${{ runner.os }}-cargo-
      - run: cargo check --all-features --locked
      - run: cargo test --all-features --locked
      - name: Test lean plugin runtime
        if: runner.os == 'Windows'
        run: cargo test --no-default-features --locked
      - run: cargo build --release --all-features --locked

  lint:
    name: Format and Clippy
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ghr-linux-x64"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux TLS build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev ca-certificates
      - name: Cache Rust build
        # Our runners skip GitHub's cache: Linux ones compile through sccache in
        # S3, and saving the cache to GitHub from AWS is slow.
        if: ${{ !startsWith(runner.name, 'ghr-') }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: lint-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: lint-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  security:
    name: Security audit
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ghr-linux-x64"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
